# Build the portable Windows app and publish it as a GitHub release whenever a version tag
# (v1.2.3) is pushed. The tag must match "version" in package.json, which is the version
# QuickCalc.exe reports, so bump that, commit, then tag:
#
#   git tag -a v1.2.3 -m "QuickCalc 1.2.3" && git push origin v1.2.3

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # electron-builder would otherwise try to publish on its own when it sees a tag in CI.
      - name: Build the portable app
        run: npm run dist -- --publish never

      - name: Zip it
        shell: pwsh
        run: |
          Rename-Item release/win-unpacked QuickCalc
          Compress-Archive -Path release/QuickCalc -DestinationPath "QuickCalc-$env:VERSION-win-x64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "QuickCalc-$VERSION-win-x64.zip" \
            --verify-tag \
            --title "QuickCalc $VERSION" \
            --generate-notes \
            --notes "Portable build for 64-bit Windows: extract the zip anywhere under your user profile and run \`QuickCalc\\QuickCalc.exe\`. No installer and no admin rights needed."
